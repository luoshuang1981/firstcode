{% extends "base_generic.html" %}
{% load i18n %}

{% block title %}{% translate "Login" %} - {{ block.super }}{% endblock %}

{% block content %}
  <h2>{% translate "Login" %}</h2>
  <form method="post" class="styled-form">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">{% translate "Login" %}</button>
  </form>
  <p class="mt-3"><a href="{% url 'password_reset' %}">{% translate "Forgot your password?" %}</a></p>
{% endblock %}
